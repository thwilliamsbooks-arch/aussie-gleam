<!DOCTYPE html>
<html>
<head><title>Netlify Forms</title></head>
<body>
  <!-- Contact form definition for Netlify detection -->
  <form name="contact" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="contact" />
    <input type="text" name="bot-field" />
    <input type="text" name="name" />
    <input type="tel" name="phone" />
    <input type="email" name="email" />
    <textarea name="message"></textarea>
  </form>

  <!-- Quote request form definition for Netlify detection -->
  <form name="quote-request" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="quote-request" />
    <input type="text" name="bot-field" />
    <input type="text" name="enquiry_type" />
    <input type="text" name="name" />
    <input type="text" name="company" />
    <input type="tel" name="phone" />
    <input type="email" name="email" />
    <input type="text" name="location" />
    <input type="text" name="fleet_size" />
    <input type="text" name="frequency" />
    <textarea name="message"></textarea>
  </form>
</body>
</html>
